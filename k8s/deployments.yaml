apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-nodeport              
spec:
  replicas: 2                    
  selector:
    matchLabels:
      app: app-nodeport         
  template:
    metadata:
      labels:
        app: app-nodeport        
    spec:
      containers:
      - name: web
        image: pod-name-app:1.0  
        imagePullPolicy: Never    
        ports:
        - containerPort: 8080     
        env:
        - name: POD_NAME        
          valueFrom:
            fieldRef:
              fieldPath: metadata.name   
