apiVersion: v1
kind: Service
metadata:
  name: app-nodeport-svc          
spec:
  type: NodePort                  
  selector:
    app: app-nodeport            
  ports:
  - port: 80                      
    targetPort: 8080             
    nodePort: 30080               
---
apiVersion: v1
kind: Service
metadata:
  name: app-clusterip-svc         
spec:
  type: ClusterIP                
  selector:
    app: app-clusterip
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-loadbalancer-svc      
spec:
  type: LoadBalancer              
  selector:
    app: app-loadbalancer
  ports:
  - port: 80
    targetPort: 8080